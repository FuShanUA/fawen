[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dcmm-audit"
version = "2.0.0"
description = "DCMM 评估报告 AI 审计系统 — 双引擎 (Gemini / GLM+Qwen-VL)"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "PyMuPDF>=1.24",
    "requests>=2.31",
    "openpyxl>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gemini = [
    "google-cloud-storage>=2.10",
    "google-cloud-aiplatform>=1.40",
    "vertexai>=1.40",
]
glm = []

[project.scripts]
dcmm = "dcmm.cli:main"

[tool.setuptools.packages.find]
include = ["dcmm*"]
