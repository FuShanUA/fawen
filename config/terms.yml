# PostOS Terminology Glossary (YAML)
# Format: "Source Term": "Target Term" # Notes

"Agent": "智能体"
"Agentic Infrastructure": "智能体基础设施" # 核心术语
"FDE": "前线部署工程师 或 FDE模式，视语境而定" # Forward Deployed Engineer/Engineering
"Data Governance": "数据治理" # 严格使用全称
"Governance Plane": "治理面" # 控制架构术语
"Data Elements": "数据要素" # 国内政策术语
"DCMM": "数据管理能力成熟度模型（这是国家标准贯标认证活动，并非IT系统建设项目，强调数据标准、认责和元数据完备性，属于企业管理与合规评估范畴）"
"Snowflake": "Snowflake 平台" # 具象化基础设施
"Databricks": "Databricks 平台"
"Vector Database": "向量数据库"
"Knowledge Graph": "知识图谱"
"Context Window": "上下文窗口"
"RAG": "检索增强生成"
"LLM Ops": "大模型运维"
"Zero-trust": "零信任"
"Compliance": "合规性"
"Metadata": "元数据"
"Catalog": "数据目录" # 修正术语，替代“数据黄页”
"Lineage": "血缘关系"
"Quality": "质量"
"Security": "安全"
"Privacy": "隐私"
"利润流失": "损失" # 简化表达
"数据黄页": "数据目录" # 强制覆盖
"Data Steward": "数据管家"
"Data Stewardship": "数据认责"
"Data Owner": "数据主人"
"Data Ownership": "数据认责 # 在数据治理语境下翻译为'数据认责'（强调责任与义务），而非'数据权属'（强调权利）。当讨论决策权、责任边界、角色分工时使用'认责'；当讨论产权、资产归属时使用'权属'"
"Enterprise Ownership": "企业认责 # 在数据治理语境下，指企业层面对数据的认责责任，而非企业所有权"
"Owner": "数据主人 # 在数据治理语境下，指数据主人（承担认责的角色），而非所有者"
"Ownership": "认责 # 在数据治理语境下翻译为'认责'（强调责任与义务），而非'权属'。当讨论决策权、责任边界、角色分工时使用'认责'；当讨论产权、资产归属时使用'权属'"
"Skills": "技能 (Skills)" # 不翻译或注明英文

